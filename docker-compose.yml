services:
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_HEAP_OPTS: "-Xmx2G -Xms2G"
      KAFKA_LOG_RETENTION_HOURS: 168
    mem_limit: 3g
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  batch:
    build: .
    command: ["python3", "starter.py"]
    working_dir: /app
    volumes:
      - .:/app

  consumer:
    build: .
    command: ["python3", "-u", "consumer.py"]
    working_dir: /app
    volumes:
      - .:/app
    mem_limit: 6g
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPARK_DRIVER_MEMORY: 4g
    depends_on:
      kafka:
        condition: service_healthy

  producer:
    build: .
    # Full Parquet range (1996-2023). No --max-messages = all ~32M ratings.
    command:
      [
        "python3",
        "-u",
        "producer.py",
        "--start-year",
        "1996",
        "--end-year",
        "2023",
        "--inject-late",
        "5",
      ]
    working_dir: /app
    volumes:
      - .:/app
    mem_limit: 4g
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
      consumer:
        condition: service_started
      batch:
        condition: service_completed_successfully

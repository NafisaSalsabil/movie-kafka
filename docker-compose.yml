services:
  kafka-init:
    image: apache/kafka:3.8.0
    user: "0:0"
    entrypoint: ["sh", "-c", "chown -R 1000:0 /var/lib/kafka/data"]
    volumes:
      - kafka-grace5:/var/lib/kafka/data
    mem_limit: 128m

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka-grace5:/var/lib/kafka/data
    mem_limit: 1g
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  batch:
    build: .
    mem_limit: 2g
    environment:
      DATABASE_PATH: /database/analytics.sqlite3
    command: ["python3", "-u", "starter.py"]
    working_dir: /app
    volumes:
      - .:/app
      - analytics-grace5:/database

  consumer:
    build: .
    command: ["python3", "-u", "consumer.py"]
    working_dir: /app
    volumes:
      - .:/app
      - analytics-grace5:/database
    mem_limit: 3g
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPARK_DRIVER_MEMORY: 1g
      DATABASE_PATH: /database/analytics.sqlite3
      CHECKPOINT_ROOT: checkpoints/stream_grace5
    depends_on:
      kafka:
        condition: service_healthy
      batch:
        condition: service_completed_successfully

  producer:
    build: .
    # Replay the bundled one-million-rating CSV after batch conversion.
    command:
      [
        "python3",
        "-u",
        "producer.py",
        "--start-year",
        "1996",
        "--end-year",
        "2023",
        "--inject-late",
        "5",
      ]
    working_dir: /app
    volumes:
      - .:/app
    mem_limit: 1g
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
      consumer:
        condition: service_started
      batch:
        condition: service_completed_successfully

  serve:
    build: .
    command: ["python3", "-u", "serve.py"]
    working_dir: /app
    volumes:
      - .:/app
      - analytics-grace5:/database
    ports:
      - "127.0.0.1:${SERVE_HOST_PORT:-8000}:8000"
    environment:
      DATABASE_PATH: /database/analytics.sqlite3
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    mem_limit: 256m
    depends_on:
      batch:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  analytics-grace5:
  kafka-grace5:
